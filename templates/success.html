<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white text-gray-800">

    <!-- Success Message Section -->
    <section class="py-20">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl font-semibold text-pink-500 mb-6">Thank You, {{ name }}!</h1>
            <p class="text-lg text-gray-700">Your order will be delivered to <span class="font-semibold">{{ email }}</span> in three business days.</p>
            <a href="{{ url_for('index') }}" class="mt-8 inline-block px-6 py-3 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition">Back to Triple 9 Tarot</a>
        </div>
    </section>

</body>
</html>
